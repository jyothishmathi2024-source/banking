name: CI/CD Banking Pipeline

on:
  push:
    branches: [ main ]

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

     patriotism - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -y -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Tests
      run: |
        pytest tests/

  build-and-push-docker:
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        TAG="v1.0.${{ github.run_number }}"
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/banking-app"
        
        docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest .
        docker push $IMAGE_NAME:$TAG
        docker push $IMAGE_NAME:latest

  deployment-to-kubernetes:
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Kubernetes Context
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Inject Unique Image Tag & Deploy
      run: |
        TAG="v1.0.${{ github.run_number }}"
        USER="${{ secrets.DOCKERHUB_USERNAME }}"
        
        # Replace the placeholders dynamically inside the deployment file
        sed -i "s|DOCKERHUB_USERNAME/banking-app:IMAGE_TAG|$USER/banking-app:$TAG|g" deployment.yaml
        
        # Apply configurations to your cluster
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
        
        # Force rollout check
        kubectl rollout status deployment/banking-app-deployment
